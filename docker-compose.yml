services:
  newsblur_web:
    hostname: nb.com
    container_name: newsblur_web
    build:
      context: .
      dockerfile: docker/newsblur_base_image.Dockerfile
    environment:
      - DOCKERBUILD=True
      - RUNWITHMAKEBUILD=${RUNWITHMAKEBUILD:-True}
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - newsblur_db_mongo
      - newsblur_db_postgres
      - newsblur_db_redis
      - newsblur_db_elasticsearch
    ulimits:
      nproc: 10000
      nofile:
        soft: 10000
        hard: 10000
    entrypoint: /bin/sh -c newsblur_web/entrypoint.sh

  newsblur_node:
    container_name: newsblur_node
    image: newsblur/newsblur_node:latest
    user: "1000:1000"
    environment:
      - NODE_ENV=docker
      - MONGODB_PORT=29019
    command: node newsblur.js
    restart: unless-stopped
    stop_signal: HUP
    depends_on:
      - newsblur_db_mongo
      - newsblur_db_postgres
      - newsblur_db_redis

  imageproxy:
    container_name: newsblur_imageproxy
    image: ghcr.io/willnorris/imageproxy:latest
    user: "1000:1000"
    entrypoint: /app/imageproxy -addr 0.0.0.0:8088 -cache /tmp/imageproxy -verbose
    restart: unless-stopped
    volumes:
      - imageproxy_cache:/tmp/imageproxy

  nginx:
    container_name: newsblur_nginx
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:1.19.6
        COPY docker/nginx/nginx.local.conf /etc/nginx/conf.d/nginx.conf
    restart: unless-stopped
    depends_on:
      - newsblur_web
      - newsblur_node
      - newsblur_db_postgres
      - newsblur_db_redis
      - newsblur_db_mongo
      - newsblur_db_elasticsearch
    environment:
      - DOCKERBUILD=True

  newsblur_db_postgres:
    container_name: newsblur_db_postgres
    image: postgres:13.1
    restart: unless-stopped
    environment:
      - POSTGRES_USER=newsblur
      - POSTGRES_PASSWORD=newsblur
    volumes:
      - postgres_data:/var/lib/postgresql/data

  newsblur_db_redis:
    container_name: newsblur_db_redis
    build:
      context: .
      dockerfile_inline: |
        FROM redis:latest
        COPY docker/redis/redis.conf /etc/redis/redis.conf
        COPY docker/redis/redis_server.conf /usr/local/etc/redis/redis_replica.conf
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server /etc/redis/redis.conf --port 6579

  newsblur_db_elasticsearch:
    container_name: newsblur_db_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms384m -Xmx384m"
      - "CLI_JAVA_OPTS="
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
      - bootstrap.memory_lock=false
      - indices.breaker.total.use_real_memory=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  dejavu:
    container_name: newsblur_dejavu
    image: appbaseio/dejavu:3.6.0
    restart: unless-stopped

  newsblur_db_mongo:
    container_name: newsblur_db_mongo
    image: mongo:4.0
    restart: unless-stopped
    command: mongod --port 29019 --wiredTigerEngineConfigString="checkpoint=(wait=60),file_manager=(close_idle_time=0)"
    volumes:
      - mongo_data:/data/db:delegated

  task_celery:
    container_name: newsblur_celery
    build:
      context: .
      dockerfile: docker/newsblur_base_image.Dockerfile
    user: "1000:1000"
    command: "celery worker -A newsblur_web -B --loglevel=INFO"
    restart: unless-stopped
    environment:
      - DOCKERBUILD=True

  newsblur_mcp:
    container_name: newsblur_mcp
    build:
      context: ./newsblur_mcp
    restart: unless-stopped
    environment:
      - PYTHONPATH=/srv/newsblur_mcp
      - NEWSBLUR_BASE_URL=http://newsblur_web:8000
      - MCP_PORT=8099
      - MCP_HOST=0.0.0.0
      - MCP_OAUTH_CLIENT_ID=newsblur-mcp-server
      - MCP_OAUTH_CLIENT_SECRET=newsblur-mcp-dev-secret
      - MCP_OAUTH_BASE_URL=https://news.mb-serv.de/mcp
      - MCP_OAUTH_UPSTREAM_URL=https://news.mb-serv.de
      - MCP_OAUTH_INTERNAL_URL=http://newsblur_web:8000
      - MCP_REDIS_URL=redis://newsblur_db_redis:6579/5
    depends_on:
      - newsblur_web

  haproxy:
    container_name: newsblur_haproxy
    build:
      context: .
      dockerfile_inline: |
        FROM haproxy:latest
        COPY docker/haproxy/haproxy.docker-compose.cfg /usr/local/etc/haproxy/haproxy.cfg
    restart: unless-stopped
    depends_on:
      - nginx
      - newsblur_web
      - newsblur_node
      - imageproxy

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  mongo_data:
  imageproxy_cache:
